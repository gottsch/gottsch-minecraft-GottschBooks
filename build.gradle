plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
}

base {
    archivesName = archives_base_name
}

// Mojang ships Java 21 to end users starting in 1.20.5, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Example books (src/example/resources) for trying the reader and taking screenshots. Resources only; added to the
// dev runs below, and left out of the jar. Players get both books on first join.
sourceSets {
    example {}
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // mods must come before runs (a run that sets loadedMods refers to them)
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            // the example books: in dev runs only, never in the jar
            sourceSet(sourceSets.example)
        }
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Headless smoke test; needs no EULA, but quits if no game tests are registered.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Dev-only runtime dependencies that are not published as dependencies of this library.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Deliberately none at runtime: Gottsch Books is self-contained (no GottschCore) so any mod can nest it.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// the parser's unit tests use Minecraft's text classes
neoForge.addModdingDependenciesTo(sourceSets.test)

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Expands ${} properties in src/main/templates (neoforge.mods.toml).
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Published as gottsch:gottschbooks-neoforge-1.21.1:<version>, the coordinate consumers nest:
//   jarJar(implementation("gottsch:gottschbooks-neoforge-1.21.1")) { version { strictly "[1.0,2.0)"; prefer "1.0.0" } }
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
        maven {
            name = "localMaven"
            url = "file:///${project.projectDir}/../maven"
        }
    }
}

// Publish to the shared ../maven repo AND mavenLocal, as GottschCore does: consumers list both,
// and whichever holds the coordinate first wins, so publishing to one leaves the other stale.
tasks.register('publishAll') {
    group = 'publishing'
    description = 'Publishes to the shared ../maven repo AND to mavenLocal, so neither can go stale.'
    dependsOn 'publish', 'publishToMavenLocal'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
